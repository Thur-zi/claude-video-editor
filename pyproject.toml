[project]
name = "claude-video-editor"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code (fork of browser-use/video-use with local transcription)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "scipy",
    "faster-whisper",                  # local transcription (default engine)
    "opencv-python-headless<5",        # face keep-out (4.x ships the Haar cascade)
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
