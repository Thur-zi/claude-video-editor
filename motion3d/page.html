<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Spec is injected by render3d.mjs as window.SPEC before this module runs.
const S = window.SPEC;
const W = S.width, H = S.height;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;   // keeps brand colours (ACES washes them out)
renderer.toneMappingExposure = S.exposure ?? 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(S.fov ?? 30, W / H, 0.1, 100);
camera.position.set(0, 0, S.cameraZ ?? 6);

const key = new THREE.DirectionalLight(0xffffff, S.keyLight ?? 2.2);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, S.rimLight ?? 1.2);
rim.position.set(-4, 2, -3);
scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, S.ambient ?? 0.25));

// ---- build extruded geometry from the vectorised contours
const V = S.vector;                       // {w,h,shapes:[{outer,holes,color}]}
const unit = 2.0 / Math.max(V.w, V.h);    // normalise to ~2 world units
const group = new THREE.Group();
const toV2 = p => new THREE.Vector2((p[0] - V.w / 2) * unit, -(p[1] - V.h / 2) * unit);
for (const sh of V.shapes) {
  const shape = new THREE.Shape(sh.outer.map(toV2));
  for (const h of sh.holes) shape.holes.push(new THREE.Path(h.map(toV2)));
  const depth = (S.depth ?? 0.35);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, curveSegments: 12, bevelEnabled: true,
    bevelThickness: S.bevel ?? 0.06, bevelSize: S.bevel ?? 0.05, bevelSegments: 6, steps: 1 });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  const color = new THREE.Color(S.color ?? sh.color);
  const mat = new THREE.MeshPhysicalMaterial({
    color, metalness: S.metalness ?? 0.2, roughness: S.roughness ?? 0.28,
    clearcoat: S.clearcoat ?? 0.8, clearcoatRoughness: 0.15, envMapIntensity: S.envIntensity ?? 1.0 });
  group.add(new THREE.Mesh(geo, mat));
}
const pivot = new THREE.Group();
pivot.add(group);
scene.add(pivot);

// ---- animation (deterministic in t)
const easeOutBack = (x, c1 = 1.4) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
window.renderFrame = (t) => {
  const A = S.anim ?? {};
  const ent = clamp(t / (A.entrance ?? 0.6));
  const s = (A.entrance ?? 0.6) > 0 ? Math.max(0.0001, easeOutBack(ent, A.overshoot ?? 1.4)) : 1;
  pivot.scale.setScalar(s * (S.scale ?? 1));
  const spin = (A.spinDegPerSec ?? 60) * Math.PI / 180;
  // swingDeg > 0: oscillate (readable text/numbers never show their mirrored back); else continuous spin
  const swing = A.swingDeg ? Math.sin(t * 2 * Math.PI / (A.swingPeriod ?? 3.2)) * A.swingDeg * Math.PI / 180 : spin * t;
  const twist = (1 - easeOutBack(ent, 1.0)) * (A.entranceTwistDeg ?? 180) * Math.PI / 180;
  pivot.rotation.y = (A.startYawDeg ?? -25) * Math.PI / 180 + swing + twist;
  pivot.rotation.x = (A.tiltDeg ?? 8) * Math.PI / 180 + Math.sin(t * 2 * Math.PI / (A.bobPeriod ?? 2.4)) * (A.wobbleDeg ?? 4) * Math.PI / 180;
  pivot.rotation.z = Math.sin(t * 2 * Math.PI / ((A.bobPeriod ?? 2.4) * 1.3)) * (A.rollDeg ?? 3) * Math.PI / 180;
  pivot.position.y = Math.sin(t * 2 * Math.PI / (A.bobPeriod ?? 2.4)) * (A.bob ?? 0.08);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.READY = true;
</script>
</body>
</html>
